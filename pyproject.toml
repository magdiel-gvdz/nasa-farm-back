[project]
name = "nasa-farm-back"
version = "0.1.0"
description = "Field Shift container API"
requires-python = ">=3.13,<3.15"
dependencies = [
    "boto3>=1.35,<2",
    "fastapi>=0.115,<1",
    "pyproj>=3.7,<4",
    "pyyaml>=6,<7",
    "shapely>=2.1,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "moto[dynamodb]>=5,<6",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
