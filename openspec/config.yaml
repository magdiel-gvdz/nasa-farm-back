schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Project: Field Shift, NASA Space Apps backend API.
  Stack: Python 3.13, FastAPI, Mangum, AWS Lambda, API Gateway HTTP and S3.
  Infrastructure: Terraform with S3 remote state and GitHub Actions OIDC.
  Environments: one persistent dev and disposable pr-N previews.
  Git: all changes reach main through pull requests; never push directly to main.
  Validation: Ruff, pytest, Terraform validate/test, actionlint and Lambda packaging.
  Scope: backend API only; scientific ingestion and agronomic scoring are separate features.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
