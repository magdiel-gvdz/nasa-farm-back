# Catálogo de cultivos de Field Shift.
#
# Lo leen los motores de aptitud y rotaciones y lo sirve GET /api/v1/crops.
# La definición y la unidad de cada campo están en docs/crop-catalog.md.
# La API valida este archivo al arrancar: si un valor no es válido, no arranca
# y el error nombra el cultivo y el campo.
#
# Revisión técnica del 15 de noviembre de 2026 (docs/crop-catalog-review.md):
# cultivos relevantes para el Sureste y La Laguna de Coahuila, con requisitos de
# FAO EcoCrop, coeficientes Kc y duraciones de FAO-56 (tablas 11 y 12) y
# temperaturas críticas de floración de la literatura agronómica. La temperatura
# crítica es la máxima diaria que en floración causa daño en un solo día: DATA
# cuenta años con al menos un día sobre el umbral, así que una temperatura óptima
# (30-32 °C) marcaría daño casi todos los veranos. Los balances de
# nitrógeno son aproximaciones de orden de magnitud (cosecha retirada, residuo
# incorporado) y el rango de pH es el tolerado en campo, no el óptimo.
#
# Fuera del catálogo por ahora: perennes (alfalfa, nogal, vid, nopal), porque los
# motores evalúan un ciclo de siembra a cosecha.

# ---------------------------------------------------------------- cereales de verano

- id: maiz
  name: {es: Maíz, en: Maize}
  family: poaceae
  roles: [cash, forage]
  cycle_days: [110, 150]
  temp_opt_c: [18, 33]
  temp_abs_c: [10, 40]
  frost_tolerant: false
  heat_critical_c: 38
  water_need_mm: [500, 800]
  # Se cultiva en los suelos calcáreos de Coahuila; pierde rendimiento por encima de ~8.0.
  ph: [5.5, 8.0]
  kc: {ini: 0.3, mid: 1.2, end: 0.6}
  n_fixing: false
  n_balance_kg_ha: -120
  residue: high
  root_depth: medium
  equipment: [tractor, planter, combine, forage_harvester]
  margin_index: null
  source_id: fao_ecocrop
  reviewed: true

