# Catálogo de cultivos de Field Shift.
#
# Lo leen los motores de aptitud y rotaciones y lo sirve GET /api/v1/crops.
# La definición y la unidad de cada campo están en docs/crop-catalog.md.
# La API valida este archivo al arrancar: si un valor no es válido, no arranca
# y el error nombra el cultivo y el campo.
#
# Estos cinco cultivos son valores iniciales de FAO EcoCrop (requisitos) y
# FAO-56 (coeficientes Kc). No están revisados por el rol científico
# (reviewed: false). Los balances de nitrógeno son aproximaciones de orden de
# magnitud.

- id: maiz
  name: {es: Maíz, en: Maize}
  family: poaceae
  roles: [cash]
  cycle_days: [100, 150]
  temp_opt_c: [18, 33]
  temp_abs_c: [10, 40]
  frost_tolerant: false
  heat_critical_c: 35
  water_need_mm: [500, 800]
  ph: [5.5, 7.5]
  kc: {ini: 0.3, mid: 1.2, end: 0.6}
  n_fixing: false
  n_balance_kg_ha: -120
  residue: high
  root_depth: medium
  equipment: [tractor, planter, combine]
  margin_index: null
  source_id: fao_ecocrop
  reviewed: false

