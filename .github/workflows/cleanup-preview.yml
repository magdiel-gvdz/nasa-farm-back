name: Cleanup preview

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Closed PR number to clean up
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: api-infra-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main' && vars.INFRA_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_project: ${{ vars.TF_PROJECT || 'nasa-farm' }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_runtime_permissions_boundary_arn: ${{ vars.RUNTIME_PERMISSIONS_BOUNDARY_ARN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Require a closed PR from this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > /tmp/pr.json
          python - <<'PY'
          import json, os
          with open('/tmp/pr.json') as handle:
              pr = json.load(handle)
          assert pr['state'] == 'closed', 'Refusing to destroy an open PR environment'
          assert pr['head']['repo']['full_name'] == os.environ['GITHUB_REPOSITORY']
          PY
          echo "TF_VAR_environment=pr-$PR_NUMBER" >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.0'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cleanup-${{ github.run_id }}
      - name: Destroy preview
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          [[ "$TF_VAR_environment" =~ ^pr-[1-9][0-9]*$ ]]
          terraform -chdir=infra/environment init -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=environments/$TF_VAR_environment/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config=encrypt=true -backend-config=use_lockfile=true
          terraform -chdir=infra/environment plan -destroy -lock-timeout=5m -out=destroy.tfplan
          terraform -chdir=infra/environment apply -lock-timeout=5m destroy.tfplan
          echo "Destroyed $TF_VAR_environment." >> "$GITHUB_STEP_SUMMARY"
