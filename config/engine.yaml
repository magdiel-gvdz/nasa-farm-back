# Parámetros de los motores agronómicos. Son decisiones de diseño, no hechos científicos:
# los revisa el rol científico (SCI). Cada parámetro está explicado en docs/engines.md.
# La API valida este archivo al arrancar.

suitability:
  # Puntaje mínimo (0-100) de cada estado; por debajo de `marginal` es `unsuitable`.
  status_cuts:
    suitable: 70
    marginal: 40
  # Peso de cada factor en el puntaje. Deben sumar 1.
  weights:
    frost: 0.30
    heat: 0.20
    water: 0.30
    soil: 0.20
  # Un factor excluyente en estado `bad` limita el puntaje a `exclusive_score_cap`.
  exclusive_factors: [frost]
  exclusive_score_cap: 39
  # Puntaje de un factor justo en el umbral de `warn` y en el de `bad`.
  score_at_warn: 70
  score_at_bad: 30
  frost:
    # Probabilidad de helada en la peor decena del ciclo.
    warn_prob: 0.2
    bad_prob: 0.5
  heat:
    # Probabilidad de calor sobre el umbral en la peor decena de la floración.
    warn_prob: 0.3
    bad_prob: 0.6
    # Parte del ciclo en la que ocurre la floración.
    flowering_window: [0.55, 0.65]
  water:
    # Fracción de la lluvia que aprovecha el cultivo.
    effective_rain_fraction: 0.8
    # Parte del ciclo con cada coeficiente Kc (inicial, media, final). Deben sumar 1.
    stage_fractions:
      ini: 0.2
      mid: 0.5
      end: 0.3
    # Déficit como fracción de la demanda.
    warn_deficit_fraction: 0.10
    bad_deficit_fraction: 0.25
  soil:
    # Cuánto puede salirse el pH del rango del cultivo antes de ser `bad`.
    ph_tolerance: 0.5
    # Clases texturales (USDA) que complican el manejo del agua.
    difficult_textures: [sand, loamy sand, clay, silty clay, sandy clay]
