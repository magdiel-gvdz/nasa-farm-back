# Parámetros de los motores agronómicos. Son decisiones de diseño, no hechos científicos:
# los revisa el rol científico (SCI). Cada parámetro está explicado en docs/engines.md.
# La API valida este archivo al arrancar.

suitability:
  # Puntaje mínimo (0-100) de cada estado; por debajo de `marginal` es `unsuitable`.
  status_cuts:
    suitable: 70
    marginal: 40
  # Peso de cada factor en el puntaje. Deben sumar 1.
  weights:
    frost: 0.30
    heat: 0.20
    water: 0.30
    soil: 0.20
  # Un factor excluyente en estado `bad` limita el puntaje a `exclusive_score_cap`.
  exclusive_factors: [frost]
  exclusive_score_cap: 39
  # Puntaje de un factor justo en el umbral de `warn` y en el de `bad`.
  score_at_warn: 70
  score_at_bad: 30
  frost:
    # Probabilidad de helada en la peor decena del ciclo.
    warn_prob: 0.2
    bad_prob: 0.5
  heat:
    # Probabilidad de calor sobre el umbral en la peor decena de la floración.
    warn_prob: 0.3
    bad_prob: 0.6
    # Parte del ciclo en la que ocurre la floración.
    flowering_window: [0.55, 0.65]
  water:
    # Fracción de la lluvia que aprovecha el cultivo.
    effective_rain_fraction: 0.8
    # Parte del ciclo con cada coeficiente Kc (inicial, media, final). Deben sumar 1.
    stage_fractions:
      ini: 0.2
      mid: 0.5
      end: 0.3
    # Déficit como fracción de la demanda.
    warn_deficit_fraction: 0.10
    bad_deficit_fraction: 0.25
  soil:
    # Cuánto puede salirse el pH del rango del cultivo antes de ser `bad`.
    ph_tolerance: 0.5
    # Clases texturales (USDA) que complican el manejo del agua.
    difficult_textures: [sand, loamy sand, clay, silty clay, sandy clay]

rotation:
  # Mes de siembra por defecto de cada temporada.
  planting_months:
    spring_summer: 5
    fall_winter: 10
  # Meses entre los que se puede mover la siembra si hace falta relajar la búsqueda.
  season_windows:
    spring_summer: [3, 4, 5, 6, 7]
    fall_winter: [9, 10, 11]
  # Referencias fijas para convertir cada métrica en un puntaje de 0 a 5.
  references:
    # Necesidad de riego anual (mm) que vale 0 en ahorro de agua; 0 mm vale 5.
    irrigation_mm: 1000
    # Balance de nitrógeno anual (kg/ha) que vale 0 y que vale 5 en salud del suelo.
    n_balance_low_kg_ha: -150
    n_balance_high_kg_ha: 50
    # Ciclos de forraje por año que valen 5 en forraje.
    forage_cycles_per_year: 1
    # Ciclos de cultivo por año que valen 0 en poca mano de obra; 1 ciclo vale 5.
    max_cycles_per_year: 3
    # Índice de margen que vale 5 en ingreso.
    margin_index: 1.5
  # Índice de materia orgánica (0-1) desde el que la tendencia mejora o se mantiene.
  om_trend:
    improving_from: 0.6
    stable_from: 0.4

greenhouse:
  # Ráfaga estimada = viento sostenido × este factor. Es un supuesto, no una medición.
  gust_factor: 1.4
  # Probabilidad anual de superar la resistencia desde la que el estado es `warn` y `bad`.
  warn_probability: 0.02
  bad_probability: 0.10
  # Días con dato que necesita un año para contar su máximo.
  min_days_per_year: 360
  # Años completos por debajo de los cuales la confianza es baja.
  reliable_years: 15
  # Años completos por debajo de los cuales no se estiman niveles de retorno.
  minimum_years: 5
